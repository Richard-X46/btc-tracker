version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: btc-tracker:latest   # local tag
    command: ["app"]
    ports:
      - "8000:8000"
    env_file:
      - .env

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: btc-tracker:latest
    command: ["agent"]
    env_file:
      - .env
resources:
  jobs:
    blocks_incremental:
      name: btc-blocks-incremental
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 */10 * * * ?
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        # generous timeouts: serverless cold starts alone can take minutes
        - task_key: merge_blocks
          timeout_seconds: 900
          environment_key: default
          spark_python_task:
            python_file: ../../src/btc_tracker/ingestion/delta_01_blocks.py
        - task_key: merge_tx
          timeout_seconds: 900
          environment_key: default
          spark_python_task:
            python_file: ../../src/btc_tracker/ingestion/delta_02_transactions.py
        - task_key: sync_price
          timeout_seconds: 600
          environment_key: default
          spark_python_task:
            python_file: ../../src/btc_tracker/ingestion/delta_03_btc_price.py

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - logfire>=4.40.0
              - python-dotenv>=1.0.0
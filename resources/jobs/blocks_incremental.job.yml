resources:
  jobs:
    blocks_incremental:
      name: btc-blocks-incremental
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0 */3 * * ?
        timezone_id: "UTC"
        # No pause_status: bundle dev mode auto-pauses schedules, so a
      tasks:
        # single task: tip gate + all three merges in one session, one cold start
        - task_key: merges
          timeout_seconds: 1500
          environment_key: default
          spark_python_task:
            python_file: ../../src/btc_tracker/ingestion/pipeline_merges.py

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - logfire>=4.40.0
              - python-dotenv>=1.0.0
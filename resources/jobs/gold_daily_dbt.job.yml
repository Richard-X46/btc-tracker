

resources:
  jobs:
    gold_daily:
      name: btc-gold-daily
      max_concurrent_runs: 1 
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: "UTC"
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - "dbt-databricks>=1.6.0,<2.0.0"
      tasks:
        - task_key: dbt_gold
          environment_key: default
          dbt_task:
            project_directory: ../../btc_gold
            warehouse_id:  "ffd32e8cc089ac87"
            catalog: workspace
            schema: btc_data
            commands:
              - "dbt build --select gold_daily_fee_metrics gold_daily_whale_activity gold_daily_miner_revenue gold_daily_block_intervals gold_daily_fee_tiers"

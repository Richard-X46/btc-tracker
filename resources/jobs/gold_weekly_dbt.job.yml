resources:
  jobs:
    gold_weekly:
      name: btc-gold-weekly
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 9 ? * MON"
        timezone_id: "UTC"
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - "dbt-databricks>=1.6.0,<2.0.0"
      tasks:
        - task_key: dbt_gold_weekly
          environment_key: default
          dbt_task:
            project_directory: ../../btc_gold
            warehouse_id: "ffd32e8cc089ac87"
            catalog: workspace
            schema: btc_data
            commands:
              - "dbt build --select gold_weekly_fee_heatmap"
